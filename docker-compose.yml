services:
  db:
    image: postgres:16
    container_name: schoolyar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: schoolyar
    ports:
      - "5432:5432"
    volumes:
      - schoolyar-pgdata:/var/lib/postgresql/data

volumes:
  schoolyar-pgdata:
